<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="./swagger-ui.css">
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
    <style>

        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            background: #fafafa;
        }
    </style>
    
</head>

<body>
    <div id="swagger-ui"></div>

    <!-- Workaround for https://github.com/swagger-api/swagger-editor/issues/1371 -->
    <script>
        if (window.navigator.userAgent.indexOf("Edge") > -1) {
            console.log("Removing native Edge fetch in favor of swagger-ui's polyfill")
            window.fetch = undefined;
        }
    </script>

    <script src="./swagger-ui-bundle.js"></script>
    <script src="./swagger-ui-standalone-preset.js"></script>
    <script>
        /* Source: https://gist.github.com/lamberta/3768814
         * Parse a string function definition and return a function object. Does not use eval.
         * @param {string} str
         * @return {function}
         *
         * Example:
         *  var f = function (x, y) { return x * y; };
         *  var g = parseFunction(f.toString());
         *  g(33, 3); //=> 99
         */
        function parseFunction(str) {
            if (!str) return void (0);

            var fn_body_idx = str.indexOf('{'),
                fn_body = str.substring(fn_body_idx + 1, str.lastIndexOf('}')),
                fn_declare = str.substring(0, fn_body_idx),
                fn_params = fn_declare.substring(fn_declare.indexOf('(') + 1, fn_declare.lastIndexOf(')')),
                args = fn_params.split(',');

            args.push(fn_body);

            function Fn() {
                return Function.apply(this, args);
            }
            Fn.prototype = Function.prototype;

            return new Fn();
        }

        window.onload = function () {
            var configObject = JSON.parse('{"urls":[{"url":"../swagger/ActionsMenuInquiry/swagger.json","name":"ActionsMenuInquiry"},{"url":"../swagger/ActivationInquiry/swagger.json","name":"ActivationInquiry"},{"url":"../swagger/AdHoc/swagger.json","name":"AdHoc"},{"url":"../swagger/AdvancedQuery/swagger.json","name":"AdvancedQuery"},{"url":"../swagger/AIRepairAdvisorInquiry/swagger.json","name":"AIRepairAdvisorInquiry"},{"url":"../swagger/ApprovalCycleInquiry/swagger.json","name":"ApprovalCycleInquiry"},{"url":"../swagger/AuditTrailInquiry/swagger.json","name":"AuditTrailInquiry"},{"url":"../swagger/BatchInquiry/swagger.json","name":"BatchInquiry"},{"url":"../swagger/CDOInquiry/swagger.json","name":"CDOInquiry"},{"url":"../swagger/CDOInstanceInfoInquiry/swagger.json","name":"CDOInstanceInfoInquiry"},{"url":"../swagger/ChangePackageInquiry/swagger.json","name":"ChangePackageInquiry"},{"url":"../swagger/ChangePackageModelingInquiry/swagger.json","name":"ChangePackageModelingInquiry"},{"url":"../swagger/ComponentIssueInquiry/swagger.json","name":"ComponentIssueInquiry"},{"url":"../swagger/ComponentReplaceInquiry/swagger.json","name":"ComponentReplaceInquiry"},{"url":"../swagger/ContainerHistoryInquiry/swagger.json","name":"ContainerHistoryInquiry"},{"url":"../swagger/ContainerInfoInquiry/swagger.json","name":"ContainerInfoInquiry"},{"url":"../swagger/ContainerInquiry/swagger.json","name":"ContainerInquiry"},{"url":"../swagger/ContentChangeHistoryInquiry/swagger.json","name":"ContentChangeHistoryInquiry"},{"url":"../swagger/DelegateDateInquiry/swagger.json","name":"DelegateDateInquiry"},{"url":"../swagger/DelegateTaskInquiry/swagger.json","name":"DelegateTaskInquiry"},{"url":"../swagger/DictionaryService/swagger.json","name":"DictionaryService"},{"url":"../swagger/EligibleContainersInquiry/swagger.json","name":"EligibleContainersInquiry"},{"url":"../swagger/EventLotDetailInquiry/swagger.json","name":"EventLotDetailInquiry"},{"url":"../swagger/ExportImportInquiry/swagger.json","name":"ExportImportInquiry"},{"url":"../swagger/ExportStatusInquiry/swagger.json","name":"ExportStatusInquiry"},{"url":"../swagger/ExportTargetInquiry/swagger.json","name":"ExportTargetInquiry"},{"url":"../swagger/FactoryHierarchyModelInquiry/swagger.json","name":"FactoryHierarchyModelInquiry"},{"url":"../swagger/FilterTagInquiry/swagger.json","name":"FilterTagInquiry"},{"url":"../swagger/GetAttachedDocuments/swagger.json","name":"GetAttachedDocuments"},{"url":"../swagger/GetChangePackageDetails/swagger.json","name":"GetChangePackageDetails"},{"url":"../swagger/GetGeneralMessage/swagger.json","name":"GetGeneralMessage"},{"url":"../swagger/GetImpactDetailsInquiry/swagger.json","name":"GetImpactDetailsInquiry"},{"url":"../swagger/GetMaintenanceStatuses/swagger.json","name":"GetMaintenanceStatuses"},{"url":"../swagger/GetMfgData/swagger.json","name":"GetMfgData"},{"url":"../swagger/GetMfgLots/swagger.json","name":"GetMfgLots"},{"url":"../swagger/GetNCRs/swagger.json","name":"GetNCRs"},{"url":"../swagger/GetToDoList/swagger.json","name":"GetToDoList"},{"url":"../swagger/ImportStatusInquiry/swagger.json","name":"ImportStatusInquiry"},{"url":"../swagger/Inquiry/swagger.json","name":"Inquiry"},{"url":"../swagger/MfgAuditTrailInquiry/swagger.json","name":"MfgAuditTrailInquiry"},{"url":"../swagger/MfgOrderInquiry/swagger.json","name":"MfgOrderInquiry"},{"url":"../swagger/ModelingAuditTrailInquiry/swagger.json","name":"ModelingAuditTrailInquiry"},{"url":"../swagger/NCRHistoryInquiry/swagger.json","name":"NCRHistoryInquiry"},{"url":"../swagger/OperatorLogInquiry/swagger.json","name":"OperatorLogInquiry"},{"url":"../swagger/PackageInquiry/swagger.json","name":"PackageInquiry"},{"url":"../swagger/PermissionInquiry/swagger.json","name":"PermissionInquiry"},{"url":"../swagger/ProcessSPCChartDynamicParams/swagger.json","name":"ProcessSPCChartDynamicParams"},{"url":"../swagger/ProcessTimerInquiry/swagger.json","name":"ProcessTimerInquiry"},{"url":"../swagger/ProductionEventInquiry/swagger.json","name":"ProductionEventInquiry"},{"url":"../swagger/QualityObjectHistoryInquiry/swagger.json","name":"QualityObjectHistoryInquiry"},{"url":"../swagger/QualityObjectInquiry/swagger.json","name":"QualityObjectInquiry"},{"url":"../swagger/ResourceAuditTrailInquiry/swagger.json","name":"ResourceAuditTrailInquiry"},{"url":"../swagger/SmartScanInquiry/swagger.json","name":"SmartScanInquiry"},{"url":"../swagger/SystemInfoInquiry/swagger.json","name":"SystemInfoInquiry"},{"url":"../swagger/UIProviderComponentInquiry/swagger.json","name":"UIProviderComponentInquiry"},{"url":"../swagger/V4_CDOInquiry/swagger.json","name":"V4_CDOInquiry"},{"url":"../swagger/V4_SecurityAuditTrailInquiry/swagger.json","name":"V4_SecurityAuditTrailInquiry"},{"url":"../swagger/ViewContainer/swagger.json","name":"ViewContainer"},{"url":"../swagger/ViewContainerStatus/swagger.json","name":"ViewContainerStatus"},{"url":"../swagger/WhereUsedInquiry/swagger.json","name":"WhereUsedInquiry"},{"url":"../swagger/WIPMessageEntityInquiry/swagger.json","name":"WIPMessageEntityInquiry"}],"deepLinking":false,"persistAuthorization":false,"displayOperationId":false,"defaultModelsExpandDepth":1,"defaultModelExpandDepth":1,"defaultModelRendering":"example","displayRequestDuration":false,"docExpansion":"list","showExtensions":false,"showCommonExtensions":false,"supportedSubmitMethods":["get","put","post","delete","options","head","patch","trace"],"tryItOutEnabled":false,"queryConfigEnabled":true,"syntaxHighlight":false}');
            var oauthConfigObject = JSON.parse('{"scopeSeparator":" ","scopes":[],"useBasicAuthenticationWithAccessCodeGrant":false,"usePkceWithAuthorizationCodeGrant":false}');

            // Workaround for https://github.com/swagger-api/swagger-ui/issues/5945
            configObject.urls.forEach(function (item) {
                if (item.url.startsWith("http") || item.url.startsWith("/")) return;
                item.url = window.location.href.replace("index.html", item.url).split('#')[0];
            });

            // If validatorUrl is not explicitly provided, disable the feature by setting to null
            if (!configObject.hasOwnProperty("validatorUrl"))
                configObject.validatorUrl = null

            // If oauth2RedirectUrl isn't specified, use the built-in default
            if (!configObject.hasOwnProperty("oauth2RedirectUrl"))
                configObject.oauth2RedirectUrl = (new URL("oauth2-redirect.html", window.location.href)).href;

            // Apply mandatory parameters
            configObject.dom_id = "#swagger-ui";
            configObject.presets = [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset];
            configObject.layout = "StandaloneLayout";

            // Parse and add interceptor functions
            var interceptors = JSON.parse('{"RequestInterceptorFunction":null,"ResponseInterceptorFunction":null}');
            if (interceptors.RequestInterceptorFunction)
                configObject.requestInterceptor = parseFunction(interceptors.RequestInterceptorFunction);
            if (interceptors.ResponseInterceptorFunction)
                configObject.responseInterceptor = parseFunction(interceptors.ResponseInterceptorFunction);

            // Begin Swagger UI call region

            const ui = SwaggerUIBundle(configObject);

            ui.initOAuth(oauthConfigObject);

            // End Swagger UI call region

            window.ui = ui
        }
    </script>
</body>
</html>
