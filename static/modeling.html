<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opcenter · 建模工具台</title><link rel="stylesheet" href="/static/workspace.css?v=20261022-chat-layout"><link rel="stylesheet" href="/static/modeling.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><img class="brand-mark" src="/static/svg/manufacturing-assistant.svg?v=2" alt="制造助手"><div><div class="brand-name">Opcenter</div><div class="brand-subtitle">MANUFACTURING WORKSPACE</div></div></a><nav class="nav"><a class="nav-item" href="/">◈　制造助手</a><a class="nav-item active" href="/modeling">▦　建模工具台</a><a class="nav-item" href="/records">▤　操作记录</a></nav></aside>
<main class="workspace"><header class="topbar"><div class="breadcrumbs"><a href="/">工作台</a><span>›</span><h1>建模工具台</h1></div><a href="/">返回对话</a></header>
<div class="bench"><p class="eyebrow">MODELING EXPLORER</p><h2>看清关系，再完成配置。</h2><p class="muted">路线与检查 · 版本与复制 · 表格导入 · 工单现场 · 容器追溯</p>
<nav id="tabs" aria-label="功能选择"><button data-tab="route" class="active">路线与检查</button><button data-tab="compare">版本与复制</button><button data-tab="import">表格导入</button><button data-tab="order">工单现场</button><button data-tab="trace">容器追溯</button></nav>
<section class="panel" id="route"><form id="routeForm"><label>对象类型<select id="routeKind"><option value="Workflows">Workflow</option><option value="Products">Product</option></select></label><label>名称<input id="routeName" required placeholder="WF-WM-900A"></label><label>版本（留空使用记录版本）<input id="routeRevision" placeholder="A"></label><button>查询并检查</button></form></section>
<section class="panel" id="compare" hidden><form id="compareForm"><label>对象类型<select id="compareKind"><option value="Workflows">Workflow</option><option value="Products">Product</option></select></label><label>来源名称<input id="leftName" required></label><label>来源版本<input id="leftRevision" required></label><label>目标名称<input id="rightName" required></label><label>目标版本<input id="rightRevision" required></label><button name="mode" value="compare">比较版本</button><button name="mode" value="copy" class="secondary">预览新路线模板</button></form><p class="muted">模板复制仅支持线性 Workflow：复制步骤、Spec 版本与顺序，目标必须不存在。复杂分支、返工及子流程会阻止生成；Product 支持版本比较。</p></section>
<section class="panel" id="import" hidden><label>选择 Excel / CSV（最多 10 MB）<input id="importFile" type="file" accept=".xlsx,.xls,.csv"></label><div class="form-row"><label>工作表<select id="sheet"></select></label><label>表头所在行<input id="header" type="number" min="1" max="31" value="1"></label><button id="readSheet" type="button">读取表头</button></div><div id="sample"></div><div id="mapping" class="mapping"></div><button id="previewImport" type="button" disabled>校验全部行并生成计划</button><p class="muted">预览不写入业务数据。生成计划后展示逐行映射、原步骤和变更范围，再送往对话确认执行。</p></section>
<section class="panel" id="order" hidden><form id="orderForm"><label>工单名称<input id="orderName" required placeholder="MO-100076435"></label><button>查看生产现场</button></form></section>
<section class="panel" id="trace" hidden><form id="traceForm"><label>容器名称<input id="traceName" required placeholder="BOX-0001"></label><label>关系深度<select id="traceDepth"><option>1</option><option selected>2</option><option>3</option></select></label><button>展开关系与历史</button></form></section>
<p id="feedback" role="status" aria-live="polite"></p><section id="result" aria-label="查询结果"></section><details id="rawDetails" hidden><summary>查看原始证据</summary><pre id="raw"></pre></details>
</div></main></div><dialog id="detail"><button id="closeDetail" aria-label="关闭详情">关闭</button><h3 id="detailTitle"></h3><pre id="detailBody"></pre></dialog><script src="/static/modeling.js"></script></body></html>
