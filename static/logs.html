<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opcenter · 运行日志</title>
    <!-- Favicon SVG -->
    <link rel="icon" type="image/svg+xml" href="/static/svg/manufacturing-assistant.svg?v=2">
    <style>
        :root {
            --primary: #008577;
            --primary-hover: #006f64;
            --bg-body: #f9fafb;
            --bg-surface: #ffffff;
            --border: #eaecf0;
            --text-main: #101828;
            --text-secondary: #475467;
            --text-tertiary: #667085;

            --success: #17b26a;
            --warning: #f79009;
            --danger: #f04438;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .badge {
            background: #ecfdf3;
            color: #027a48;
            padding: 2px 8px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }

        /* Layout */
        .app-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar (Logs List) */
        .trace-sidebar {
            width: 320px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .trace-sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            background: #fcfcfd;
        }

        .log-list {
            flex: 1;
            overflow-y: auto;
        }

        .log-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }

        .log-item:hover {
            background: #f9fafb;
        }

        .log-item.active {
            background: #eff8ff;
            border-left: 3px solid var(--primary);
            padding-left: 17px;
            /* compensate for border */
        }

        .log-query {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .log-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .log-meta-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .latency {
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .latency.slow {
            color: var(--danger);
            font-weight: 500;
        }

        /* Main Trace View */
        .main-content {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-body);
            position: relative;
        }

        .main-header {
            background: var(--bg-surface);
            padding: 24px 32px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .trace-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .trace-stats {
            display: flex;
            gap: 24px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-weight: 600;
            color: var(--text-main);
        }

        .trace-body {
            padding: 32px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Stepper UI (Dify Trace Node Style) */
        .trace-nodes {
            margin-top: 16px;
        }

        .node {
            display: flex;
            margin-bottom: 0;
            /* managed by line */
        }

        .node-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 16px;
            position: relative;
        }

        .node-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #fff;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
            z-index: 2;
        }

        .node-icon.llm {
            color: #7a5af8;
            border-color: #d9d6fe;
            background-color: #f4f3ff;
        }

        .node-icon.tool {
            color: #0ba5ec;
            border-color: #e0f2fe;
            background-color: #f0f9ff;
        }

        .node-line {
            width: 2px;
            flex: 1;
            background: #eaecf0;
            margin: 4px 0;
        }

        .node-right {
            flex: 1;
            padding-bottom: 32px;
        }

        .node:last-child .node-line {
            display: none;
        }

        .node:last-child .node-right {
            padding-bottom: 0;
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-top: 4px;
        }

        .node-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .node-time {
            font-size: 12px;
            color: var(--text-tertiary);
            background: var(--bg-body);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
        }

        .node-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.03);
            font-size: 13px;
        }

        .meta-row {
            display: flex;
            margin-bottom: 8px;
        }

        .meta-label {
            width: 90px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .meta-value {
            color: var(--text-main);
            font-family: ui-monospace, monospace;
            background: #f2f4f7;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* Empty & Loading states */
        .empty-view {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            font-size: 14px;
        }

        .empty-view svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            color: #d0d5dd;
        }

        /* SVG Icons Helper */
        .icon-sm {
            width: 14px;
            height: 14px;
        }

        .icon-md {
            width: 16px;
            height: 16px;
        }
    </style>

<body><button class="sidebar-backdrop" id="sidebarBackdrop" aria-label="关闭导航"></button>
<div class="app-shell"><aside class="sidebar" aria-label="工作台导航">
<a class="brand" href="/"><img class="brand-mark" src="/static/svg/manufacturing-assistant.svg?v=2" alt="制造助手"><div><div class="brand-name">Opcenter</div><div class="brand-subtitle">MANUFACTURING WORKSPACE</div></div></a>
<button class="new-chat new-chat-entry" id="newChatTopBtn" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3H7a4 4 0 0 0-4 4v10a4 4 0 0 0 4 4h10a4 4 0 0 0 4-4v-5"/><path d="m16 3-8 8-1 4 4-1 8-8a2.12 2.12 0 0 0-3-3Z"/></svg><span>新建对话</span></button>
<nav class="nav"><a class="nav-item" id="chatNav" href="/">◈　制造助手</a><a class="nav-item" id="recordsNav" href="/records">▤　操作记录</a><a class="nav-item active" href="/logs" aria-current="page">☷　运行日志</a></nav>
<div class="recent-heading">最近聊天</div><div class="session-list" id="sessionListUI"></div>
<div class="sidebar-footer"><div class="user-profile"><span class="avatar">M</span><div><div class="user-name" id="username">正在连接</div></div><span class="siemens">SIEMENS</span></div></div></aside>
<main class="workspace"><header class="topbar"><div class="breadcrumbs"><button class="menu-toggle" id="menuToggle" aria-label="展开导航" aria-expanded="false">☰</button><span>工作台</span><span>›</span><h1 id="pageTitle">运行日志</h1></div><div class="top-actions"><div id="envStatus"><span class="badge">监控采集中</span></div><div class="connection" id="connection" role="status" hidden><span class="status-dot"></span><span id="connectionText">正在连接</span></div><button class="guide-toggle" id="guideToggle" hidden aria-expanded="false" aria-controls="modelingGuide">建模指南</button></div></header>

    <div class="app-layout">
        <!-- Sidebar -->
        <div class="trace-sidebar">
            <div class="trace-sidebar-header">
                最近调用记录
            </div>
            <div class="log-list" id="sidebarList">
                <!-- Render list here -->
                <div style="padding: 20px; text-align: center; color: #667085; font-size: 13px;">加载中...</div>
            </div>
        </div>

        <!-- Main Trace View -->
        <div class="main-content" id="mainTraceContent">
            <div class="empty-view">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <path d="M3 9h18M9 21V9" />
                </svg>
                从左侧选择一条执行记录查看详细 Tracer
            </div>
        </div>
    </div>

</main></div><div id="notice" role="alert" hidden></div>
    <script>
        let globalGroups = [];

        const PAGE_SIZE = 20;
        let nextCursor = null, hasMore = true, logsLoading = false;
        let selectedIndex = -1;
        document.addEventListener('DOMContentLoaded', () => {
            initializeNavigation();
            fetchLogs();
            document.getElementById('sidebarList').addEventListener('scroll', event => {
                const list = event.currentTarget;
                if (list.scrollHeight - list.scrollTop - list.clientHeight < 160) fetchLogs();
            }, {passive: true});
        });

        async function fetchLogs() {
            if (logsLoading || !hasMore) return;
            logsLoading = true;
            const list = document.getElementById('sidebarList');
            let status = list.querySelector('.log-load-status');
            if (status) status.textContent = '加载中…';
            try {
                const params = new URLSearchParams({limit: PAGE_SIZE});
                if (nextCursor) params.set('cursor', nextCursor);
                const res = await fetch('/api/logs/groups?' + params);
                if (!res.ok) throw new Error(res.status === 404 ? '后台尚未加载日志分页接口，请重启服务后刷新' : `日志加载失败（HTTP ${res.status}）`);
                const data = await res.json();
                if (data.status === 'disabled') {
                    hasMore = false;
                    document.getElementById('envStatus').innerHTML = '<span class="badge" style="background:#fef3f2;color:#b42318">监控已停用</span>';
                    list.textContent = '日志采集已关闭';
                    return;
                }
                const start = globalGroups.length;
                globalGroups.push(...data.groups);
                nextCursor = data.next_cursor;
                hasMore = data.has_more;
                renderSidebar(start);
                if (selectedIndex < 0 && globalGroups.length) selectTrace(0);
                status = document.createElement('div');
                status.className = 'log-load-status';
                status.setAttribute('role', 'status');
                status.textContent = !globalGroups.length ? '暂无调用记录' : hasMore ? '向下滚动加载更多' : '已显示全部记录';
                list.append(status);
            } catch (error) {
                list.querySelector('.log-load-status')?.remove();
                if (!globalGroups.length) list.replaceChildren();
                const retry = document.createElement('button');
                retry.className = 'log-load-status';
                retry.textContent = error.message.includes('后台尚未加载') ? error.message : '加载失败，点击重试';
                retry.onclick = () => fetchLogs();
                list.append(retry);
            } finally { logsLoading = false; }
        }

        function renderSidebar(start = 0) {
            const listEl = document.getElementById('sidebarList');
            if (start === 0) listEl.replaceChildren();
            else listEl.querySelector('.log-load-status')?.remove();

            globalGroups.slice(start).forEach((group, pageIndex) => {
                const index = start + pageIndex;
                const div = document.createElement('div');
                div.className = 'log-item';
                div.setAttribute('data-index', index);
                div.onclick = () => selectTrace(index);

                // parse time (only show HH:MM:SS inside lists)
                const timeStr = group.timestamp.split(' ')[1] || group.timestamp;
                const latencyStr = (group.totalTimeMs / 1000).toFixed(2);
                const latencyClass = group.totalTimeMs > 4000 ? 'latency slow' : 'latency';

                div.innerHTML = `
                <div class="log-query">${escapeHtml(group.prompt)}</div>
                <div class="log-meta">
                    <span class="log-meta-user">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        ${escapeHtml(group.username)}
                    </span>
                    <div class="log-meta-right">
                        <span>${timeStr}</span>
                        <span class="${latencyClass}">${latencyStr}s</span>
                    </div>
                </div>
            `;
                listEl.appendChild(div);
            });
        }

        function selectTrace(index) {
            selectedIndex = index;
            // Highlight logic
            const items = document.querySelectorAll('.log-item');
            items.forEach(el => el.classList.remove('active'));
            if (items[index]) items[index].classList.add('active');

            const group = globalGroups[index];
            const mainEl = document.getElementById('mainTraceContent');

            // Reverse steps array to chronological order
            const chronoSteps = [...group.steps].reverse();

            const llmCount = chronoSteps.filter(s => s.action.toLowerCase().includes('llm')).length;
            const toolCount = chronoSteps.length - llmCount;
            const totalSecs = (group.totalTimeMs / 1000).toFixed(2);

            let stepsHtml = '';
            chronoSteps.forEach(step => {
                const isLLM = step.action.toLowerCase().includes('llm');
                const iconClass = isLLM ? 'node-icon llm' : 'node-icon tool';

                // Dify icons
                const svgIcon = isLLM ?
                    `<svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>` :
                    `<svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`;

                const title = isLLM ? 'LLM Inference 核心推理' : 'Tool Execute 工具分发';

                let metaHtml = '';
                if (isLLM && step.details.model) {
                    metaHtml += `<div class="meta-row"><div class="meta-label">Model</div><div class="meta-value">${step.details.model}</div></div>`;
                }
                if (!isLLM && step.details.tool) {
                    metaHtml += `<div class="meta-row"><div class="meta-label">Target Name</div><div class="meta-value">${step.details.tool}</div></div>`;
                }
                
                // Add start and end timestamps if available
                if (step.start_time && step.end_time) {
                    metaHtml += `<div class="meta-row"><div class="meta-label" style="width: 60px;">Started</div><div class="meta-value" style="background: transparent; padding: 0;">${step.start_time}</div></div>`;
                    metaHtml += `<div class="meta-row"><div class="meta-label" style="width: 60px;">Finished</div><div class="meta-value" style="background: transparent; padding: 0;">${step.end_time}</div></div>`;
                }

                stepsHtml += `
                <div class="node">
                    <div class="node-left">
                        <div class="${iconClass}">${svgIcon}</div>
                        <div class="node-line"></div>
                    </div>
                    <div class="node-right">
                        <div class="node-header">
                            <div class="node-title">${title}</div>
                            <div class="node-time">${(step.duration_ms / 1000).toFixed(2)}s</div>
                        </div>
                        <div class="node-card">
                            ${metaHtml}
                        </div>
                    </div>
                </div>
            `;
            });

            mainEl.innerHTML = `
            <div class="main-header">
                <div class="trace-title">"${escapeHtml(group.prompt)}"</div>
                <div class="trace-stats">
                    <div class="stat-item">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        请求时间: <span class="stat-value">${group.timestamp}</span>
                    </div>
                    <div class="stat-item">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                        总耗时: <span class="stat-value">${totalSecs}s</span>
                    </div>
                    <div class="stat-item" style="color: var(--primary);">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                        包含 ${llmCount} 次模型推理, ${toolCount} 次工具调用
                    </div>
                </div>
            </div>
            <div class="trace-body">
                <h3 style="font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 24px; display:flex; align-items:center; gap:8px;">
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    全链路 Tracer (按时间游标正序)
                </h3>
                <div class="trace-nodes">
                    ${stepsHtml}
                </div>
            </div>
        `;
        }

        async function initializeNavigation() {
            const byId = id => document.getElementById(id);
            const closeNavigation = () => {
                document.body.classList.remove('sidebar-open');
                byId('menuToggle').setAttribute('aria-expanded', 'false');
            };
            byId('menuToggle').onclick = () => {
                const open = document.body.classList.toggle('sidebar-open');
                byId('menuToggle').setAttribute('aria-expanded', String(open));
            };
            byId('sidebarBackdrop').onclick = closeNavigation;
            document.addEventListener('keydown', event => { if (event.key === 'Escape') closeNavigation(); });
            const request = async (url, options) => {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error('导航加载失败');
                return response.json();
            };
            byId('newChatTopBtn').disabled = true;
            try {
                const config = await request('/config');
                byId('username').textContent = config.username;
                byId('newChatTopBtn').disabled = false;
                byId('newChatTopBtn').onclick = async () => {
                    byId('newChatTopBtn').disabled = true;
                    try {
                        const data = await request(`/sessions/${encodeURIComponent(config.username)}/new`, {method: 'POST'});
                        location.href = '/?session_id=' + encodeURIComponent(data.session_id);
                    } catch (error) {
                        byId('notice').textContent = '新建对话失败，请重试';
                        byId('notice').hidden = false;
                        byId('newChatTopBtn').disabled = false;
                    }
                };
                const data = await request('/sessions/' + encodeURIComponent(config.username));
                const sessions = (data.sessions || []).slice().reverse().filter(session => session.run ||
                    (typeof session.has_messages === 'boolean' ? session.has_messages : !/^新对话 \d+$/.test(session.title || '')));
                document.querySelector('.recent-heading').hidden = !sessions.length;
                for (const session of sessions.slice(0, 30)) {
                    const link = document.createElement('a');
                    link.className = 'session-item';
                    link.href = '/?session_id=' + encodeURIComponent(session.id);
                    const title = document.createElement('span');
                    title.className = 'session-title';
                    title.textContent = session.title || '未命名对话';
                    link.append(title);
                    const label = {queued:'执行中',running:'执行中',cancelling:'停止中',approval_required:'待确认',interrupted:'需核实',incomplete:'需核实',limited:'达到上限',failed:'出错'}[session.run?.status];
                    if (label) {
                        const badge = document.createElement('span');
                        badge.className = 'run-badge ' + session.run.status;
                        badge.textContent = label;
                        link.append(badge);
                    }
                    byId('sessionListUI').append(link);
                }
                byId('sessionListUI').addEventListener('scroll', () => {
                    document.querySelector('.recent-heading').classList.toggle('is-scrolled', byId('sessionListUI').scrollTop > 0);
                }, {passive: true});
            } catch (error) {
                byId('notice').textContent = '导航加载失败，请刷新重试';
                byId('notice').hidden = false;
            }
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
